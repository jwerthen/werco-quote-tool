version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: quoteengine
      POSTGRES_PASSWORD: quoteengine
      POSTGRES_DB: quoteengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-25T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quoteengine
      MINIO_ROOT_PASSWORD: quoteengine123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
